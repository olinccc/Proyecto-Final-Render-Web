<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda Página</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            cursor: url('/mosca.png') 16 16, auto;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        * {
            cursor: url('/mosca.png') 16 16, auto !important;
        }
        
        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: url('/mosca.png'), pointer;
        }
        
        a:hover {
            background: #555;
            transform: scale(1.05);
        }
        
        .mosca-trail {
            position: absolute;
            pointer-events: none;
            width: 45px;
            height: 45px;
            background-image: url('/mosca.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
    </style>
</head>
<body>
    <video id="background-video" autoplay loop muted playsinline>
        <source src="/noise.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>
    
    <script>
        // Agregar rastro de moscas al hacer click
        document.addEventListener('click', (e) => {
            const mosca = document.createElement('div');
            mosca.className = 'mosca-trail';
            mosca.style.left = (e.clientX - 22.5) + 'px';
            mosca.style.top = (e.clientY - 22.5) + 'px';
            document.body.appendChild(mosca);
            
            // Opcional: remover la mosca después de un tiempo
            // setTimeout(() => mosca.remove(), 5000);
        });
    </script>
</body>
</html>
