<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancid City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background-image: url('/textura.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Myriad Pro', Arial, sans-serif;
            color: #333;
            cursor: url('/mosca.png') 16 16, auto;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        .title {
            position: fixed;
            left: 50px;
            top: 50%;
            transform: translateY(-50%) scaleY(3.5);
            font-family: 'Myriad Pro', Arial, sans-serif;
            font-size: 10em;
            font-weight: 400;
            color: #000;
            z-index: 50;
            text-align: left;
            filter: blur(4px);
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .title.show {
            opacity: 1;
        }
        
        * {
            cursor: url('/mosca.png') 16 16, auto !important;
        }
        
        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: url('/mosca.png'), pointer;
        }
        
        a:hover {
            background: #555;
            transform: scale(1.05);
        }
        
        .mosca-trail {
            position: absolute;
            pointer-events: none;
            width: 45px;
            height: 45px;
            background-image: url('/mosca.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
        
        #comida-image {
            position: fixed;
            top: 50%;
            left: 85%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            cursor: pointer;
        }
        
        #comida-image:hover {
            transform: translate(-50%, -50%) scale(1.05);
            transition: all 0.3s ease;
        }
        
        #comida-image.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <video id="background-video" autoplay loop muted playsinline>
        <source src="/noise.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>
    
    <h1 class="title">rancid city</h1>
    
    <img id="comida-image" src="/comidapodri.png" alt="Comida podrida">
    
    <script>
        // Contador de clicks
        let clickCount = 0;
        
        // Agregar rastro de moscas al hacer click
        document.addEventListener('click', (e) => {
            const mosca = document.createElement('div');
            mosca.className = 'mosca-trail';
            mosca.style.left = (e.clientX - 22.5) + 'px';
            mosca.style.top = (e.clientY - 22.5) + 'px';
            document.body.appendChild(mosca);
            
            // Incrementar contador de clicks
            clickCount++;
            console.log('Clicks:', clickCount);
            
            // Mostrar imagen después de 7 clicks
            if (clickCount === 7) {
                const comidaImage = document.getElementById('comida-image');
                comidaImage.classList.add('show');
            }
            
            // Opcional: remover la mosca después de un tiempo
            // setTimeout(() => mosca.remove(), 5000);
        });
        
        // Quitar el video después de 3 segundos y mostrar el título
        setTimeout(() => {
            const video = document.getElementById('background-video');
            video.style.transition = 'opacity 1s ease';
            video.style.opacity = '0';
            
            setTimeout(() => {
                video.remove();
                // Mostrar el título después de que se quite el video
                const title = document.querySelector('.title');
                title.classList.add('show');
            }, 1000); // Esperar a que termine la transición
        }, 3000); // 3 segundos
        
        // Click en la imagen para ir a la siguiente página
        document.getElementById('comida-image').addEventListener('click', () => {
            window.location.href = 'page3.html';
        });
    </script>
</body>
</html>
