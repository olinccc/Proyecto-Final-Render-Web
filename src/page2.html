<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancid City</title>
    <style>
        /* Reset de estilos globales */
        * {
            margin: 0;
            padding: 0;
        }
        
        /* Estilos del body - textura de fondo y cursor personalizado */
        body {
            background-image: url('/textura.png'); /* Fondo con textura que permanece */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Myriad Pro', Arial, sans-serif;
            color: #333;
            cursor: url('/mosca.png') 16 16, auto; /* Cursor personalizado de mosca */
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }
        
        /* Título "rancid city" con distorsión vertical */
        .title {
            position: fixed;
            left: 50px;
            top: 50%;
            transform: translateY(-50%) scaleY(3.5); /* Distorsión vertical 3.5x */
            font-family: 'Myriad Pro', Arial, sans-serif;
            font-size: 10em;
            font-weight: 400; /* Regular */
            color: #000;
            z-index: 50;
            text-align: left;
            filter: blur(4px); /* Desenfoque ligero */
            opacity: 0; /* Oculto inicialmente */
            transition: opacity 1s ease;
        }
        
        /* Clase para mostrar el título después del video */
        .title.show {
            opacity: 1;
        }
        
        /* Aplicar cursor de mosca a todos los elementos */
        * {
            cursor: url('/mosca.png') 16 16, auto !important;
        }
        
        /* Video de fondo (noise.mp4) que se reproduce 3 segundos */
        #background-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover; /* Cubrir toda la pantalla */
            z-index: 0;
        }
        
        /* Estilos no utilizados actualmente */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: url('/mosca.png'), pointer;
        }
        
        a:hover {
            background: #555;
            transform: scale(1.05);
        }
        
        /* Rastros de moscas que aparecen al hacer click */
        .mosca-trail {
            position: absolute;
            pointer-events: none; /* No interfiere con otros clicks */
            width: 45px;
            height: 45px;
            background-image: url('/mosca.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
        
        /* Imagen de comida podrida que aparece después de 7 clicks */
        #comida-image {
            position: fixed;
            top: 50%;
            left: 85%; /* Posicionada a la derecha */
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            z-index: 100; /* Arriba de todo */
            display: none; /* Oculta inicialmente */
            opacity: 0;
            transition: opacity 1s ease;
            cursor: pointer; /* Clickeable para ir a page3 */
        }
        
        /* Efecto hover en la imagen */
        #comida-image:hover {
            transform: translate(-50%, -50%) scale(1.05);
            transition: all 0.3s ease;
        }
        
        /* Clase para mostrar la imagen */
        #comida-image.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Video de fondo que se reproduce por 3 segundos -->
    <video id="background-video" autoplay loop muted playsinline>
        <source src="/noise.mp4" type="video/mp4">
        Tu navegador no soporta el elemento de video.
    </video>
    
    <!-- Título "rancid city" distorsionado que aparece después del video -->
    <h1 class="title">rancid city</h1>
    
    <!-- Imagen de comida podrida que aparece después de 7 clicks -->
    <img id="comida-image" src="/comidapodri.png" alt="Comida podrida">
    
    <script>
        // ===== CONTADOR DE CLICKS =====
        let clickCount = 0;
        
        // ===== EVENTO: Agregar rastro de moscas al hacer click =====
        document.addEventListener('click', (e) => {
            // Crear elemento div con la imagen de mosca
            const mosca = document.createElement('div');
            mosca.className = 'mosca-trail';
            // Posicionar en las coordenadas del click (centrado)
            mosca.style.left = (e.clientX - 22.5) + 'px';
            mosca.style.top = (e.clientY - 22.5) + 'px';
            document.body.appendChild(mosca);
            
            // Incrementar contador de clicks
            clickCount++;
            console.log('Clicks:', clickCount);
            
            // Mostrar imagen de comida podrida después de 7 clicks
            if (clickCount === 7) {
                const comidaImage = document.getElementById('comida-image');
                comidaImage.classList.add('show');
            }
            
            // Opcional: remover la mosca después de un tiempo para liberar memoria
            // setTimeout(() => mosca.remove(), 5000);
        });
        
        // ===== ANIMACIÓN: Quitar video y mostrar título =====
        setTimeout(() => {
            const video = document.getElementById('background-video');
            video.style.transition = 'opacity 1s ease';
            video.style.opacity = '0'; // Fade out del video
            
            setTimeout(() => {
                video.remove(); // Eliminar video del DOM
                // Mostrar el título "rancid city" con fade in
                const title = document.querySelector('.title');
                title.classList.add('show');
            }, 1000); // Esperar 1 segundo (duración del fade out)
        }, 3000); // Iniciar después de 3 segundos
        
        // ===== NAVEGACIÓN: Click en imagen para ir a page3 =====
        document.getElementById('comida-image').addEventListener('click', () => {
            window.location.href = 'page3.html';
        });
    </script>
</body>
</html>
