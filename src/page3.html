<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancid City</title>
    <script>
      (function(d) {
        var config = {
          kitId: 'rkl6csl',
          scriptTimeout: 3000,
          async: true
        },
        h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
      })(document);
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background-image: url('/fondo_e3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'yoon-px-pixelbatang', Arial, sans-serif;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        #puzzle-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
            z-index: 100;
        }

        .puzzle-piece {
            background-color: #fff423;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .puzzle-piece:hover {
            transform: scale(0.98);
        }

        .puzzle-piece.removed {
            opacity: 0;
            pointer-events: none;
        }
        
        .content {
            text-align: center;
            z-index: 10;
            max-width: 800px;
            padding: 0 60px;
        }
        
        h1 {
            font-size: 7em;
            margin-bottom: 20px;
            line-height: 1.2;
            color: #ff006a;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        @media (max-width: 1200px) {
            h1 {
                font-size: 5em;
            }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            cursor: crosshair;
        }
        
        body {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        body > * {
            transform: scale(1);
            filter: url(#pixelate);
        }
    </style>
</head>
<body>
    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="pixelate" x="0%" y="0%" width="100%" height="100%">
                <feFlood x="4" y="4" height="2" width="2"/>
                <feComposite width="10" height="10"/>
                <feTile result="a"/>
                <feComposite in="SourceGraphic" in2="a" operator="in"/>
                <feMorphology operator="dilate" radius="5"/>
            </filter>
        </defs>
    </svg>
    <canvas id="eraser-canvas"></canvas>
    <div class="content">
        <h1>Yesterday is gone; tomorrow is uncertain; today is here. Use it wisley.</h1>
    </div>


    
    <script>
        const canvas = document.getElementById('eraser-canvas');
        const ctx = canvas.getContext('2d');
        
        // Configurar el tamaño del canvas
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Configurar opacidad del canvas
        ctx.globalAlpha = 0.85;
        
        // Llenar el canvas con color amarillo
        ctx.fillStyle = '#fff423';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Restaurar globalAlpha para el borrador
        ctx.globalAlpha = 1.0;
        
        // Variables para el pincel
        let isDrawing = false;
        const brushSize = 40;
        
        // Función para borrar
        function erase(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, brushSize, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Eventos del mouse
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            erase(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                erase(e.clientX, e.clientY);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });
        
        // Eventos táctiles para dispositivos móviles
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const touch = e.touches[0];
            erase(touch.clientX, touch.clientY);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDrawing) {
                const touch = e.touches[0];
                erase(touch.clientX, touch.clientY);
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isDrawing = false;
        });
        
        // Ajustar tamaño del canvas al redimensionar ventana
        window.addEventListener('resize', () => {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.putImageData(imageData, 0, 0);
        });
    </script>
</body>
</html>
