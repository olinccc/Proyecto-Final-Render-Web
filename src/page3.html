<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancid City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background-image: url('/fondo_e3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        #puzzle-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(6, 1fr);
            z-index: 100;
        }

        .puzzle-piece {
            background-color: #FFD700;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .puzzle-piece:hover {
            transform: scale(0.98);
        }

        .puzzle-piece.removed {
            opacity: 0;
            pointer-events: none;
        }
        
        .content {
            text-align: center;
            z-index: 10;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="puzzle-layer"></div>
    <div class="content">
        <h1>Tercera Escena</h1>
    </div>

    <script>
        // Crear las piezas del rompecabezas
        const puzzleLayer = document.getElementById('puzzle-layer');
        const rows = 6;
        const cols = 8;
        const totalPieces = rows * cols;

        for (let i = 0; i < totalPieces; i++) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.addEventListener('click', function() {
                this.classList.add('removed');
            });
            puzzleLayer.appendChild(piece);
        }
    </script>
</body>
</html>
